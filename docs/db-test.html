<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VoIP Margin Console — DB Test</title><style>body{font:14px Segoe UI;background:#0b0f18;color:#e7ecf5;margin:0}.wrap{max-width:900px;margin:40px auto;padding:20px}.card{background:#121a28;border:1px solid #243044;border-radius:12px;padding:18px;margin:12px 0}input,button{padding:10px;border-radius:8px;border:1px solid #243044;margin:4px;background:#182233;color:#e7ecf5}button{background:#4fd1c5;color:#08131a;font-weight:700;cursor:pointer}.msg{white-space:pre-wrap;background:#182233;padding:12px;border-radius:8px}.ok{color:#3ecf8e}.err{color:#ef5b5b}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #243044;text-align:left}</style></head><body><main class="wrap"><h1>VoIP Margin Console — Supabase DB Test</h1><div class="card"><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="run">Connect & Check Database</button><div id="msg" class="msg">Not tested.</div></div><div id="result" class="card" style="display:none"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="./config.js"></script><script>(async()=>{const c=window.SUPABASE_CONFIG,sb=window.supabase.createClient(c.url,c.anonKey),$=x=>document.getElementById(x),msg=(t,k='')=>{$('msg').textContent=t;$('msg').className='msg '+k};$('run').onclick=async()=>{msg('Signing in and checking customer_routes…');const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)return msg('LOGIN FAILED\n'+error.message,'err');const {count,error:ce}=await sb.from('customer_routes').select('*',{count:'exact',head:true});if(ce)return msg('DATABASE READ FAILED\n'+ce.message,'err');const {data:rows,error:re}=await sb.from('customer_routes').select('id,customer,destination,provider,sell,buy,profit').order('id').limit(10);if(re)return msg('DATABASE SAMPLE FAILED\n'+re.message,'err');msg('DATABASE CONNECTION SUCCESS\nTable: customer_routes\nRows visible to this account: '+count,'ok');$('result').style.display='block';$('result').innerHTML='<h3>First 10 rows</h3><table><tr><th>ID</th><th>Customer</th><th>Destination</th><th>Provider</th><th>Sell</th><th>Buy</th><th>Profit</th></tr>'+rows.map(r=>'<tr><td>'+r.id+'</td><td>'+r.customer+'</td><td>'+r.destination+'</td><td>'+r.provider+'</td><td>'+r.sell+'</td><td>'+r.buy+'</td><td>'+r.profit+'</td></tr>').join('')+'</table>'};})();</script></body></html>
